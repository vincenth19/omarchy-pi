# Pi 5 display configuration.
#
# Integer scaling only. Fractional scale factors (1.25, 1.5, ...) make Hyprland
# render oversized then downsample, a path the Pi's V3D Mesa driver handles
# badly — the documented symptom is a solid-black waybar plus rendering
# artifacts. Integer scales use the simple path and are stable.
#
# If you need larger UI on a 4K panel use scale 2, not 1.5.
monitor = , preferred, auto, 1
