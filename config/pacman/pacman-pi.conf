# Omarchy pacman config, Pi/aarch64 variant.
#
# Differences from upstream default/pacman/pacman-stable.conf:
#   - [multilib] removed (x86-only, has no aarch64 counterpart)
#   - core/extra come from Arch Linux ARM, not Omarchy's Arch mirror
#     (stable-mirror.omarchy.org has no aarch64 tree)
#   - [alarm] and [aur] added: Arch Linux ARM's own repos
#   - [omarchy] repointed at our aarch64 rebuilds, since
#     pkgs.omarchy.org publishes x86_64 only

[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
Architecture = aarch64
CheckSpace
ParallelDownloads = 5

# Arch Linux ARM signs packages but not repo databases, and ships no .db.sig
# files -- DatabaseOptional is required or every sync 404s on core.db.sig.
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

[omarchy-pi]
SigLevel = Optional TrustAll
Server = file:///var/cache/omarchy-pi/repo
