# omarchy-pi: adapt Omarchy's initramfs config for the Raspberry Pi / aarch64.
#
# This is an ADDITIVE drop-in. It sorts after omarchy_hooks.conf and
# thunderbolt_module.conf and edits the resulting arrays, so it keeps working
# even when upstream rewrites its own drop-ins. Editing their files instead
# would put us in conflict on every release, on files we do not own.

# btrfs-overlayfs ships with the Limine/snapper stack, which this port does
# not install (the Pi boots from its own firmware, and the root is ext4).
# Naming a hook that does not exist makes mkinitcpio fail the whole build.
HOOKS=("${HOOKS[@]/btrfs-overlayfs}")

# The Pi kernel has no Thunderbolt. Naming a missing module is also fatal.
if ! modinfo thunderbolt >/dev/null 2>&1; then
  MODULES=("${MODULES[@]/thunderbolt}")
fi

# encrypt expects a LUKS root; omarchy-pi images are not encrypted.
if [[ ! -e /etc/crypttab.initramfs ]]; then
  HOOKS=("${HOOKS[@]/encrypt}")
fi
