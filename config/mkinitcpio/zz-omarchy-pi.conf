# omarchy-pi: adapt Omarchy's initramfs config for the Raspberry Pi / aarch64.
#
# This is an ADDITIVE drop-in. It sorts after omarchy_hooks.conf and
# thunderbolt_module.conf and edits the resulting arrays, so it keeps working
# even when upstream rewrites its own drop-ins. Editing their files instead
# would put us in conflict on every release, on files we do not own.
#
# NOTE: do not be tempted by HOOKS=("${HOOKS[@]/name}"). That substitution
# replaces the match with an EMPTY STRING rather than removing the element,
# and mkinitcpio then fails with "Hook '' cannot be found". The empty entries
# are invisible in "${HOOKS[*]}", so the mistake looks correct when printed.
# Rebuild the arrays instead.

_omarchy_pi_drop_hooks=()

# btrfs-overlayfs ships with the Limine/snapper stack, which this port does not
# install: the Pi boots from its own firmware and the root is ext4.
_omarchy_pi_drop_hooks+=(btrfs-overlayfs)

# encrypt expects a LUKS root; omarchy-pi images are not encrypted.
[[ -e /etc/crypttab.initramfs ]] || _omarchy_pi_drop_hooks+=(encrypt)

_omarchy_pi_keep=()
for _omarchy_pi_hook in "${HOOKS[@]}"; do
  [[ -n $_omarchy_pi_hook ]] || continue
  for _omarchy_pi_drop in "${_omarchy_pi_drop_hooks[@]}"; do
    [[ $_omarchy_pi_hook == "$_omarchy_pi_drop" ]] && continue 2
  done
  _omarchy_pi_keep+=("$_omarchy_pi_hook")
done
HOOKS=("${_omarchy_pi_keep[@]}")

# The Pi kernel has no Thunderbolt, and naming a missing module is fatal.
if ! modinfo thunderbolt >/dev/null 2>&1; then
  _omarchy_pi_keep=()
  for _omarchy_pi_mod in "${MODULES[@]}"; do
    [[ -n $_omarchy_pi_mod && $_omarchy_pi_mod != thunderbolt ]] || continue
    _omarchy_pi_keep+=("$_omarchy_pi_mod")
  done
  MODULES=("${_omarchy_pi_keep[@]}")
fi

unset _omarchy_pi_drop_hooks _omarchy_pi_keep _omarchy_pi_hook _omarchy_pi_drop _omarchy_pi_mod
