name: Build image

# Builds the flashable Pi image and attaches it to a GitHub Release.
# Runs on GitHub's native arm64 runners, so package builds are not emulated.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      variant:
        description: 'Image variant'
        type: choice
        options: [pi, vm]
        default: pi

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Fetch source repos
        run: |
          git clone --depth 1 https://github.com/omacom-io/omarchy-pkgs.git ../omarchy-pkgs
          git clone --depth 1 -b pi5 https://github.com/vincenth19/omarchy.git ../omarchy

      - name: Build base images
        run: |
          docker build --platform linux/arm64 -t alarm-work  -f docker/Dockerfile.alarm docker/
          docker build --platform linux/arm64 -t alarm-build -f docker/Dockerfile.build docker/

      - name: Build aarch64 packages
        run: |
          mkdir -p work/out
          docker run --rm --platform linux/arm64 \
            -v "$PWD/../omarchy-pkgs/pkgbuilds:/pkgbuilds:ro" \
            -v "$PWD/work/out:/out" -v "$PWD/scripts:/scripts:ro" \
            -e PACKAGES="$(tr '\n' ' ' < packages/aarch64-rebuild.txt)" \
            alarm-build bash /scripts/build-pkgs.sh

      # Cheapest gate first: seconds, no Docker, catches policy and config
      # regressions before anything expensive runs.
      - name: Tests (fast)
        run: ./test/run.sh

      - name: Verify the patch series still applies to latest stable
        run: ./scripts/sync-upstream.sh

      - name: Tests (container)
        run: ./test/run.sh container

      - name: Build image
        env:
          VARIANT: ${{ inputs.variant || 'pi' }}
        run: ./scripts/build-all.sh

      # The release gate. A VM image is built and booted from the same
      # packages, and must reach graphical.target with no failed units. If this
      # fails nothing is published and users stay on the last good release.
      - name: Release gate - boot a VM image and smoke-test it
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-arm ovmf
          VARIANT=vm ./scripts/build-all.sh
          FW_CODE=/usr/share/AAVMF/AAVMF_CODE.fd ./scripts/smoke-test.sh

      - name: Compress
        run: |
          xz -T0 -6 work/out/omarchy-pi.img
          sha256sum work/out/omarchy-pi.img.xz > work/out/omarchy-pi.img.xz.sha256

      # Only reached when the gate above passed.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            work/out/omarchy-pi.img.xz
            work/out/omarchy-pi.img.xz.sha256
          body: |
            Flash with Raspberry Pi Imager (choose "Use custom" and select the .img.xz).

            Default login: `omarchy` / `omarchy` — change it on first boot.
